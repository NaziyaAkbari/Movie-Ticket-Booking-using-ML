{% extends 'booking/base.html' %}
{% block content %}
<h2>Booking Report</h2>
<table class="table table-dark">
<tr>
<th>Name</th>
<th>Movie</th>
<th>Seat</th>
</tr>
{% for d in data %}
<tr>
<td>{{d.user_name}}</td>
<td>{{d.movie.name}}</td>
<td>{{d.seat_number}}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
